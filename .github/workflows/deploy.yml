name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天重建一次,讓 /poe 的下載數與版本跟上 GitHub Releases(UTC 20:00 = 台灣 04:00)。
  # 注意:repo 連續 60 天沒有活動時 GitHub 會停用排程,需到 Actions 頁手動重新啟用。
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 更新 src/data/releases.json 只用於這次建置,不回寫 repo。
      # 抓取失敗時腳本會保留已提交的快照;continue-on-error 是最後一道保險,下載數晚一天不該擋部署。
      - name: Fetch release stats
        run: npm run fetch-releases
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # build 會先跑 validate-content。客戶真名不在這個公開 repo 裡,靠 secret 注入。
      #
      # REQUIRE_PROTECTED_TERMS=1 讓「拿不到識別詞」直接使建置失敗,不接受降級掃描。
      # 這條路徑是無人值守的上線路徑:secret 若被誤刪或改名,只印警告的話沒有人會看到,
      # 護欄會靜默退化成只檢查本機路徑,而網站照常部署。寧可紅燈也不要假的綠燈。
      # (ci.yml 刻意不設這個變數——fork 送來的 PR 拿不到 secret,硬失敗會讓外部 PR 永遠紅。)
      - name: Build Astro
        run: npm run build
        env:
          PROTECTED_TERMS: ${{ secrets.PROTECTED_TERMS }}
          REQUIRE_PROTECTED_TERMS: '1'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
