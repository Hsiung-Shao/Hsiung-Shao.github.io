name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 每天抓一次下載數寫進 data 分支,再用新資料重建(UTC 20:00 = 台灣 04:00)。
  # 注意:repo 連續 60 天沒有活動時 GitHub 會停用排程,需到 Actions 頁手動重新啟用。
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: write # stats job 要推 data 分支
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 下載數與歷史只存在 data 分支(main 不再提交),由這個 job 每天寫一筆。
  # 只在排程與手動觸發時跑;push main 時略過,build 直接用 data 分支現有的版本。
  stats:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull data branch
        run: node scripts/pull-data.mjs

      # 抓取失敗時腳本會保留舊資料並以 0 結束,今天只是沒有新的一筆。
      - name: Fetch release stats
        run: npm run fetch-releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record history
        run: npm run record-history

      - name: Commit to data branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin data --depth=1
          git worktree add ../data-branch FETCH_HEAD
          cp src/data/releases.json src/data/download-history.json ../data-branch/
          cd ../data-branch
          git add releases.json download-history.json
          if git diff --cached --quiet; then
            echo '資料沒有變化,不 commit'
          else
            git commit -m "chore(data): $(TZ=Asia/Taipei date +%F)"
            git push origin HEAD:data
          fi

  build:
    needs: stats
    # stats 被略過(push main)或成功時都要建置;stats 失敗時仍用 data 分支上次的版本部署,
    # 下載數晚一天不該擋上線。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build 前的 prebuild 鉤子會跑 pull-data,從 data 分支拉 releases.json 與 download-history.json。
      # build 會先跑 validate-content。客戶真名不在這個公開 repo 裡,靠 secret 注入。
      #
      # REQUIRE_PROTECTED_TERMS=1 讓「拿不到識別詞」直接使建置失敗,不接受降級掃描。
      # 這條路徑是無人值守的上線路徑:secret 若被誤刪或改名,只印警告的話沒有人會看到,
      # 護欄會靜默退化成只檢查本機路徑,而網站照常部署。寧可紅燈也不要假的綠燈。
      # (ci.yml 刻意不設這個變數——fork 送來的 PR 拿不到 secret,硬失敗會讓外部 PR 永遠紅。)
      - name: Build Astro
        run: npm run build
        env:
          PROTECTED_TERMS: ${{ secrets.PROTECTED_TERMS }}
          REQUIRE_PROTECTED_TERMS: '1'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    # 預設的 success() 會連 stats 被略過也一起算進來而跳過部署,所以明確只看 build。
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
